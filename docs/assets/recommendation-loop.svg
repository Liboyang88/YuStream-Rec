<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The YuStream recommendation loop</title>
  <desc id="desc">Basic user information is turned into an LLM-generated profile and interest topics. Topics are embedded and searched in Milvus. Candidates are filtered against recent recommendations, reranked by an LLM into a cache for the next feed window, and returned immediately from the current cache or a coarse fallback. Interactions flow into Redis Streams and periodically update the profile.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: -0.4px; }
      .subtitle { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .box-title { font: 600 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-sub { font: 400 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .arrow-label { font: 500 11px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .note { font: 400 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .note-title { font: 600 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .legend { font: 500 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .step { font: 700 10px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6366f1; letter-spacing: 0.1em; }
      .app { fill: #eef2ff; stroke: #c7d2fe; }
      .llm { fill: #fff7ed; stroke: #fdba74; }
      .data { fill: #ecfdf5; stroke: #6ee7b7; }
      .neutral { fill: #f8fafc; stroke: #cbd5e1; }
      .box { stroke-width: 1.4; rx: 12; }
      .flow { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
      .flow-soft { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>

  <text x="40" y="48" class="title">The YuStream recommendation loop</text>
  <text x="40" y="76" class="subtitle">Profile → recall → rerank → feedback → profile. No feature pipeline, no model training.</text>

  <!-- Row 1: profile and recall -->
  <text x="40" y="102" class="step">Row 01 PROFILE</text>
  <rect x="40" y="110" width="190" height="72" class="box neutral" rx="12"/>
  <text x="135" y="139" text-anchor="middle" class="box-title">Basic user info</text>
  <text x="135" y="158" text-anchor="middle" class="box-sub">age, field, org, interests, etc.</text>

  <rect x="270" y="110" width="210" height="72" class="box llm" rx="12"/>
  <text x="375" y="139" text-anchor="middle" class="box-title">LLM profile bootstrap</text>
  <text x="375" y="158" text-anchor="middle" class="box-sub">tool call: summary + topics</text>

  <rect x="520" y="110" width="240" height="72" class="box app" rx="12"/>
  <text x="640" y="139" text-anchor="middle" class="box-title">User profile</text>
  <text x="640" y="158" text-anchor="middle" class="box-sub">long-term summary + interest topics</text>

  <rect x="800" y="110" width="170" height="72" class="box app" rx="12"/>
  <text x="885" y="139" text-anchor="middle" class="box-title">Embedding</text>
  <text x="885" y="158" text-anchor="middle" class="box-sub">1024-d topic vector</text>

  <rect x="1010" y="110" width="150" height="72" class="box data" rx="12"/>
  <text x="1085" y="139" text-anchor="middle" class="box-title">Milvus HNSW</text>
  <text x="1085" y="158" text-anchor="middle" class="box-sub">top-K recall</text>

  <!-- Row 2: candidates, rerank, cache, delivery -->
  <text x="40" y="292" class="step">Row 02 RECALL + RERANK + DELIVERY</text>

  <rect x="1010" y="300" width="150" height="72" class="box app" rx="12"/>
  <text x="1085" y="329" text-anchor="middle" class="box-title">Candidates</text>
  <text x="1085" y="348" text-anchor="middle" class="box-sub">recent-rec filter</text>

  <rect x="760" y="300" width="200" height="72" class="box llm" rx="12"/>
  <text x="860" y="329" text-anchor="middle" class="box-title">LLM rerank</text>
  <text x="860" y="348" text-anchor="middle" class="box-sub">18 picks + outline</text>

  <rect x="490" y="300" width="230" height="72" class="box data" rx="12"/>
  <text x="605" y="329" text-anchor="middle" class="box-title">Recommendation cache</text>
  <text x="605" y="348" text-anchor="middle" class="box-sub">prepared for the next window</text>

  <rect x="220" y="300" width="240" height="72" class="box app" rx="12"/>
  <text x="340" y="329" text-anchor="middle" class="box-title">Return this window</text>
  <text x="340" y="348" text-anchor="middle" class="box-sub">cached LLM result or coarse fallback</text>

  <rect x="40" y="300" width="150" height="72" class="box app" rx="12"/>
  <text x="115" y="329" text-anchor="middle" class="box-title">Feed UI</text>
  <text x="115" y="348" text-anchor="middle" class="box-sub">scroll = next window</text>

  <rect x="220" y="394" width="240" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="340" y="418" text-anchor="middle" class="note">cache miss -return coarse now</text>

  <rect x="500" y="394" width="210" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="605" y="418" text-anchor="middle" class="note">always one window ahead</text>

  <!-- Row 3: feedback -->
  <text x="40" y="472" class="step">Row 03 FEEDBACK</text>

  <rect x="40" y="480" width="220" height="72" class="box data" rx="12"/>
  <text x="150" y="509" text-anchor="middle" class="box-title">Interactions</text>
  <text x="150" y="528" text-anchor="middle" class="box-sub">record users' interaction, from UI</text>

  <rect x="320" y="480" width="180" height="72" class="box data" rx="12"/>
  <text x="410" y="509" text-anchor="middle" class="box-title">Redis Stream</text>
  <text x="410" y="528" text-anchor="middle" class="box-sub">last 40 events</text>

  <rect x="560" y="480" width="220" height="72" class="box llm" rx="12"/>
  <text x="670" y="509" text-anchor="middle" class="box-title">LLM profile update</text>
  <text x="670" y="528" text-anchor="middle" class="box-sub">every 5 LLM responses</text>

  <rect x="885" y="480" width="220" height="72" class="box data" rx="12"/>
  <text x="995" y="509" text-anchor="middle" class="box-title">Record shown items</text>
  <text x="995" y="528" text-anchor="middle" class="box-sub">recent-rec ZSET</text>

  <!-- Arrows -->
  <path d="M 230 146 H 262" class="flow"/>
  <path d="M 480 146 H 512" class="flow"/>
  <path d="M 760 146 H 792" class="flow"/>
  <path d="M 970 146 H 1002" class="flow"/>
  <path d="M 1085 182 V 292" class="flow"/>
  <path d="M 1010 336 H 968" class="flow"/>
  <path d="M 760 336 H 728" class="flow"/>
  <path d="M 490 336 H 467" class="flow"/>
  <path d="M 220 336 H 198" class="flow"/>
  <path d="M 150 372 V 472" class="flow"/>
  <path d="M 260 516 H 312" class="flow"/>
  <path d="M 500 516 H 552" class="flow"/>

  <!-- Profile update feedback loop, routed through the gap between cache and rerank -->
  <path d="M 740 480 L 740 240 L 640 240 L 640 190" class="flow"/>
  <text x="752" y="408" transform="rotate(-90 752 408)" class="arrow-label">profile update</text>

  <!-- Record / exclude anti-repeat loop -->
  <path d="M 860 372 L 950 472" class="flow"/>
  <text x="916" y="430" text-anchor="middle" class="arrow-label">record</text>
  <path d="M 1040 480 L 1085 380" class="flow"/>
  <text x="1078" y="440" text-anchor="middle" class="arrow-label">exclude</text>

  <!-- Legend -->
  <rect x="40" y="620" width="16" height="16" rx="4" class="app" stroke-width="1.2"/>
  <text x="64" y="633" class="legend">Application logic</text>
  <rect x="200" y="620" width="16" height="16" rx="4" class="llm" stroke-width="1.2"/>
  <text x="224" y="633" class="legend">LLM call</text>
  <rect x="320" y="620" width="16" height="16" rx="4" class="data" stroke-width="1.2"/>
  <text x="344" y="633" class="legend">State / vector store</text>
</svg>

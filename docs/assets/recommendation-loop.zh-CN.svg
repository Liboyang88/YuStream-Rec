<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">YuStream 推荐闭环</title>
  <desc id="desc">用户基本信息经 LLM 生成画像与兴趣点；兴趣点向量化后在 Milvus 中召回；候选集过滤近期推荐后，由 LLM 精排并写入下一窗口缓存，当前窗口直接返回精排缓存或粗排兜底；交互行为写入 Redis Stream，并定期更新画像。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; letter-spacing: -0.4px; }
      .subtitle { font: 400 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .box-title { font: 600 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .box-sub { font: 400 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .arrow-label { font: 500 11px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .note { font: 400 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .legend { font: 500 12px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .step { font: 700 10px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #6366f1; letter-spacing: 0.1em; }
      .app { fill: #eef2ff; stroke: #c7d2fe; }
      .llm { fill: #fff7ed; stroke: #fdba74; }
      .data { fill: #ecfdf5; stroke: #6ee7b7; }
      .neutral { fill: #f8fafc; stroke: #cbd5e1; }
      .box { stroke-width: 1.4; rx: 12; }
      .flow { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>

  <text x="40" y="48" class="title">YuStream 推荐闭环</text>
  <text x="40" y="76" class="subtitle">画像 → 召回 → 精排 → 推荐流 → 画像；无需特征工程，也无需训练模型。</text>

  <!-- 第一行：画像与召回 -->
  <text x="40" y="102" class="step">01 · 用户画像</text>
  <rect x="40" y="110" width="190" height="72" class="box neutral" rx="12"/>
  <text x="135" y="139" text-anchor="middle" class="box-title">用户基本信息</text>
  <text x="135" y="158" text-anchor="middle" class="box-sub">年龄 · 领域 · 机构 · 兴趣</text>

  <rect x="270" y="110" width="210" height="72" class="box llm" rx="12"/>
  <text x="375" y="139" text-anchor="middle" class="box-title">LLM 画像初始化</text>
  <text x="375" y="158" text-anchor="middle" class="box-sub">工具调用：summary + topics</text>

  <rect x="520" y="110" width="240" height="72" class="box app" rx="12"/>
  <text x="640" y="139" text-anchor="middle" class="box-title">用户画像</text>
  <text x="640" y="158" text-anchor="middle" class="box-sub">长期 summary + 短期兴趣点</text>

  <rect x="800" y="110" width="170" height="72" class="box app" rx="12"/>
  <text x="885" y="139" text-anchor="middle" class="box-title">向量化</text>
  <text x="885" y="158" text-anchor="middle" class="box-sub">1024 维兴趣点向量</text>

  <rect x="1010" y="110" width="150" height="72" class="box data" rx="12"/>
  <text x="1085" y="139" text-anchor="middle" class="box-title">Milvus HNSW</text>
  <text x="1085" y="158" text-anchor="middle" class="box-sub">Top-K 召回</text>

  <!-- 第二行：候选、精排、缓存、返回 -->
  <text x="40" y="292" class="step">02 · 召回 + 精排 + 返回</text>

  <rect x="1010" y="300" width="150" height="72" class="box app" rx="12"/>
  <text x="1085" y="329" text-anchor="middle" class="box-title">候选集合</text>
  <text x="1085" y="348" text-anchor="middle" class="box-sub">过滤近期推荐</text>

  <rect x="760" y="300" width="200" height="72" class="box llm" rx="12"/>
  <text x="860" y="329" text-anchor="middle" class="box-title">LLM 精排</text>
  <text x="860" y="348" text-anchor="middle" class="box-sub">选出 18 条 + outline</text>

  <rect x="490" y="300" width="230" height="72" class="box data" rx="12"/>
  <text x="605" y="329" text-anchor="middle" class="box-title">推荐缓存</text>
  <text x="605" y="348" text-anchor="middle" class="box-sub">为下一窗口准备</text>

  <rect x="210" y="300" width="240" height="72" class="box app" rx="12"/>
  <text x="330" y="329" text-anchor="middle" class="box-title">返回当前窗口</text>
  <text x="330" y="348" text-anchor="middle" class="box-sub">精排缓存或粗排兜底</text>

  <rect x="40" y="300" width="150" height="72" class="box app" rx="12"/>
  <text x="115" y="329" text-anchor="middle" class="box-title">推荐流 UI</text>
  <text x="115" y="348" text-anchor="middle" class="box-sub">下滑 = 下一窗口</text>

  <rect x="220" y="394" width="240" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="340" y="418" text-anchor="middle" class="note">缓存未命中 → 立即粗排返回</text>

  <rect x="500" y="394" width="210" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="605" y="418" text-anchor="middle" class="note">永远领先一轮</text>

  <!-- 第三行：反馈 -->
  <text x="40" y="472" class="step">03 · 反馈</text>

  <rect x="40" y="480" width="220" height="72" class="box data" rx="12"/>
  <text x="150" y="509" text-anchor="middle" class="box-title">交互行为</text>
  <text x="150" y="528" text-anchor="middle" class="box-sub">view · click · scroll · like</text>

  <rect x="320" y="480" width="180" height="72" class="box data" rx="12"/>
  <text x="410" y="509" text-anchor="middle" class="box-title">Redis Stream</text>
  <text x="410" y="528" text-anchor="middle" class="box-sub">最近 40 条</text>

  <rect x="560" y="480" width="220" height="72" class="box llm" rx="12"/>
  <text x="670" y="509" text-anchor="middle" class="box-title">LLM 更新画像</text>
  <text x="670" y="528" text-anchor="middle" class="box-sub">每 5 个 LLM 响应</text>

  <rect x="840" y="480" width="220" height="72" class="box data" rx="12"/>
  <text x="950" y="509" text-anchor="middle" class="box-title">记录已推荐物品</text>
  <text x="950" y="528" text-anchor="middle" class="box-sub">防重复 ZSET</text>

  <!-- 箭头 -->
  <path d="M 230 146 H 262" class="flow"/>
  <path d="M 480 146 H 512" class="flow"/>
  <path d="M 760 146 H 792" class="flow"/>
  <path d="M 970 146 H 1002" class="flow"/>
  <path d="M 1085 182 V 292" class="flow"/>
  <path d="M 1010 336 H 968" class="flow"/>
  <path d="M 760 336 H 728" class="flow"/>
  <path d="M 490 336 H 458" class="flow"/>
  <path d="M 210 336 H 198" class="flow"/>
  <path d="M 115 372 V 472" class="flow"/>
  <path d="M 260 516 H 312" class="flow"/>
  <path d="M 500 516 H 552" class="flow"/>

  <!-- 画像更新反馈环 -->
  <path d="M 740 480 L 740 240 L 640 240 L 640 190" class="flow"/>
  <text x="752" y="408" transform="rotate(-90 752 408)" class="arrow-label">更新画像</text>

  <!-- 记录 / 排除 -->
  <path d="M 860 372 L 950 472" class="flow"/>
  <text x="916" y="430" text-anchor="middle" class="arrow-label">记录</text>
  <path d="M 1040 480 L 1085 380" class="flow"/>
  <text x="1078" y="440" text-anchor="middle" class="arrow-label">排除</text>

  <!-- 图例 -->
  <rect x="40" y="620" width="16" height="16" rx="4" class="app" stroke-width="1.2"/>
  <text x="64" y="633" class="legend">应用逻辑</text>
  <rect x="200" y="620" width="16" height="16" rx="4" class="llm" stroke-width="1.2"/>
  <text x="224" y="633" class="legend">LLM 调用</text>
  <rect x="320" y="620" width="16" height="16" rx="4" class="data" stroke-width="1.2"/>
  <text x="344" y="633" class="legend">状态 / 向量存储</text>

  <text x="40" y="684" class="note">画像是查询：用户不需要主动提问，就能获得推荐。</text>
  <text x="1160" y="684" text-anchor="end" class="note">LitStream 参考实现</text>
</svg>
